# .github/workflows/release.yml
name: .NET Build and Publish

on:
  push:
    branches: [ "main" ]
    paths:
      - '**/*.csproj'        # 仅当项目文件变更时才触发，避免频繁运行

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
        - uses: actions/checkout@v4
          with:
            fetch-depth: 0
            fetch-tags: true
    
        - name: Setup .NET
          uses: actions/setup-dotnet@v5
          with:
            dotnet-version: 10.0.x
    
        - name: Remove lock file if exists
          run: |
            rm -f ./Line.Framework/packages.lock.json || true
            rm -f ./Line.Framework.Default/packages.lock.json || true

        - name: Restore dependencies (all projects)
          run: |
            dotnet restore ./Line.Framework/ -p:RestorePackagesWithLockFile=false -p:RestoreLockedMode=false
            dotnet restore ./Line.Framework.Default/ -p:RestorePackagesWithLockFile=false -p:RestoreLockedMode=false

        - name: Build projects
          run: |
            dotnet build ./Line.Framework/ -c Release -o ./Line.Framework/bin/Release/net10.0/
            dotnet build ./Line.Framework.Default/ -c Release -o ./Line.Framework.Default/bin/Release/net10.0/

        - name: Get core version from Line.Framework and apply to Default
          id: get_versions
          run: |
            CORE_VER=$(grep -oP '(?<=<Version>).*?(?=</Version>)' ./Line.Framework/Line.Framework.csproj)
            # 将 Default 的版本设置为 Core 版本（不直接修改 csproj，而是在打包时覆盖）
            echo "core_version=$CORE_VER" >> $GITHUB_OUTPUT
            echo "default_version=$CORE_VER" >> $GITHUB_OUTPUT

        - name: Pack both projects (apply core version to Default)
          run: |
            dotnet pack -c Release ./Line.Framework/ -o ./packages
            dotnet pack -c Release ./Line.Framework.Default/ -o ./packages /p:Version=${{ steps.get_versions.outputs.core_version }}

        - name: Create and push tags
          run: |
            git config user.name github-actions
            git config user.email github-actions@github.com

            for tag in "v${{ steps.get_versions.outputs.core_version }}" "v${{ steps.get_versions.outputs.default_version }}"; do
              if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
                echo "Tag $tag already exists on origin, skipping"
              elif git rev-parse "$tag" >/dev/null 2>&1; then
                echo "Tag $tag already exists locally, skipping"
              else
                git tag "$tag"
                git push origin "$tag"
              fi
            done

        - name: Create GitHub Release
          uses: softprops/action-gh-release@v2
          with:
            tag_name: v${{ steps.get_versions.outputs.core_version }}
            name: "Release (core) v${{ steps.get_versions.outputs.core_version }}"
            files: ./packages/*.nupkg
            generate_release_notes: true

        - name: Push both packages to NuGet.org
          run: |
            for pkg in ./packages/*.nupkg; do
              echo "Pushing $pkg"
              dotnet nuget push "$pkg" \
                --source https://api.nuget.org/v3/index.json \
                --api-key ${{ secrets.NUGET_API_KEY }} \
                --skip-duplicate || true
            done
